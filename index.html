<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PEG - Início</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Changa+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="animation.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="buttons/button.css">
</head>
<body>

    <header class="cabecalho">
        <img src="assets/peg.png" alt="Logo PEG" class="logo">
    </header>

    <main class="container">
        <div class="caixa-texto">
            Na PEG, consertamos geladeiras e ar-condicionado, e fazemos instalação e manutenção com qualidade e agilidade. Entre em contato e solicite seu orçamento.
        </div>
        <div class="grupo-botoes1">
            <button class="btn botaoAnima">Solicitar orçamento</button>
            <button class="btn botaoAnima">Mais informações</button>
        </div>

        <div class="caixa-conteudo">
            <img src="assets/arcondicionado1.jpg" alt="Imagem ArCondicionado1" class="imagemRedonda">
            <img src="assets/arcondicionado2.jpg" alt="Imagem ArCondicionado2" class="imagemRedonda">
            <img src="assets/arcondicionado3.jpg" alt="Imagem ArCondicionado3" class="imagemRedonda">
            <button class="botaoAnima btn-seta"> > </button>
        </div>

        <div class="grupo-botoes2 container-botao1">
            <button class="btn btnMaisClaro btn-destaque botaoAnima">Instalação</button>
            <button class="btn btnMaisClaro btn-destaque botaoAnima">Manutenção</button>
        </div>

    </main>

    <script src="control.js"></script>

</body>
</html>
